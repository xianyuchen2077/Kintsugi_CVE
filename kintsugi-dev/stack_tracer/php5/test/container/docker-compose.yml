services:
  web:
    image: docker.xuanyuan.me/vulhub/joomla:3.4.5
    container_name: stack-tracer-php5-test
    ports:
      - "8080:80"
    volumes:
      - ./tracer.so:/usr/local/lib/php/extensions/no-debug-non-zts-20131226/tracer.so
      - ./99-tracer.ini:/usr/local/etc/php/conf.d/99-tracer.ini
    working_dir: /var/www/html
