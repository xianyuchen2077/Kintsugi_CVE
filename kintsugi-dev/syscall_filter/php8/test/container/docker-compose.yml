services:
  web:
    image: docker.xuanyuan.me/vulhub/cmsms:2.2.9.1
    container_name: syscall-filter-php8-test
    ports:
      - "8070:80"
    volumes:
      - ./data:/var/www/html/uploads
      - ./syscall_filter.so:/usr/local/lib/php/extensions/no-debug-non-zts-20170718/syscall_filter.so
      - ./99-syscall-filter.ini:/usr/local/etc/php/conf.d/99-syscall-filter.ini
      - ../../test:/test:ro
